<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>The Golf Aide Notebook</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background: linear-gradient(135deg, #1a1a2e 0%, #16213e 100%);
            color: #2c3e50;
            min-height: 100vh;
            overflow: auto;
            padding: 20px;
            display: flex;
            justify-content: center;
            align-items: flex-start;
        }

        .container {
            width: 390px;
            height: 844px;
            display: flex;
            flex-direction: column;
            background: white;
            border-radius: 40px;
            box-shadow: 0 20px 60px rgba(0,0,0,0.4), inset 0 0 0 12px #000;
            overflow: hidden;
            position: relative;
        }

        .container::before {
            content: '';
            position: absolute;
            top: 0;
            left: 50%;
            transform: translateX(-50%);
            width: 150px;
            height: 28px;
            background: #000;
            border-radius: 0 0 20px 20px;
            z-index: 100;
        }

        .header {
            background: linear-gradient(135deg, #2ecc71 0%, #27ae60 100%);
            color: white;
            padding: 16px 16px 12px 16px;
            display: flex;
            justify-content: space-between;
            align-items: center;
            box-shadow: 0 2px 8px rgba(0,0,0,0.15);
        }

        .header-title {
            font-size: 18px;
            font-weight: 600;
            letter-spacing: 0.5px;
        }

        .header-buttons {
            display: flex;
            gap: 6px;
        }

        .header-btn {
            background: rgba(255,255,255,0.25);
            border: 1px solid rgba(255,255,255,0.3);
            color: white;
            padding: 4px 8px;
            border-radius: 4px;
            cursor: pointer;
            font-size: 9px;
            transition: all 0.2s;
            font-weight: 500;
            margin-top: 17px;
        }

        .header-btn:hover {
            background: rgba(255,255,255,0.35);
        }

        .header-btn:active {
            transform: scale(0.98);
        }

        .category-bar {
            background: linear-gradient(135deg, #2ecc71 0%, #27ae60 100%);
            border-bottom: 1px solid rgba(0,0,0,0.1);
            overflow-x: auto;
            overflow-y: hidden;
            padding: 6px 8px;
            display: flex;
            gap: 6px;
            padding-left: 8px;
            padding-right: 8px;
        }

        .category-btn {
            background: rgba(255,255,255,0.15);
            border: 1px solid rgba(255,255,255,0.25);
            color: white;
            padding: 5px 12px;
            border-radius: 16px;
            cursor: pointer;
            white-space: nowrap;
            font-size: 11px;
            transition: all 0.2s;
            flex-shrink: 0;
            font-weight: 500;
        }

        .category-btn.active {
            background: rgba(255,255,255,0.3);
            border: 1px solid rgba(255,255,255,0.5);
        }

        .category-btn:active {
            transform: scale(0.95);
        }

        .content-area {
            flex: 1;
            overflow: hidden;
            position: relative;
            display: flex;
            flex-direction: column;
            min-height: 0;
        }

        .page {
            position: absolute;
            width: 100%;
            height: 100%;
            background: #f8f9fa;
            padding: 0;
            overflow-y: auto;
            display: none;
            opacity: 0;
            transition: opacity 0.3s ease-in-out;
            top: 0;
            left: 0;
            right: 0;
            bottom: 0;
        }

        .page.active {
            display: block;
            opacity: 1;
            z-index: 1;
        }

        .page.prev {
            z-index: 0;
        }

        .page-content {
            width: 100%;
            max-width: 100%;
            margin: 0;
            background: white;
            background-image: repeating-linear-gradient(to bottom, transparent 0px, transparent 23px, #e8e8e8 23px, #e8e8e8 24px);
            background-position: 0 30px;
            padding: 30px 20px;
            border-radius: 0;
            box-shadow: none;
            position: relative;
            font-family: 'Georgia', serif;
            line-height: 1.6;
            min-height: 100%;
        }

        .cover-page .page-content {
            background: none;
            padding: 40px 20px;
        }

        .tips-toggle {
            background: linear-gradient(135deg, #27ae60 0%, #229954 100%);
            color: white;
            border: none;
            padding: 10px 16px;
            border-radius: 6px;
            cursor: pointer;
            font-weight: 600;
            font-size: 14px;
            margin: 16px 0;
            width: 100%;
            transition: all 0.2s ease;
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 8px;
        }

        .tips-toggle:hover {
            background: linear-gradient(135deg, #229954 0%, #1e8449 100%);
            transform: translateY(-2px);
            box-shadow: 0 4px 8px rgba(0,0,0,0.2);
        }

        .tips-toggle:active {
            transform: translateY(0);
        }

        .tips-content {
            display: none;
            max-height: 0;
            overflow: hidden;
            transition: max-height 0.3s ease;
            background: #f0f8f5;
            border-left: 3px solid #27ae60;
            padding: 0 16px;
            margin: 12px 0;
        }

        .tips-content.expanded {
            display: block;
            max-height: 2000px;
            padding: 16px;
            border-radius: 4px;
        }

        .page-content::before {
            display: none;
        }

        .page-content::after {
            display: none;
        }

        .cover-page .page-content::before {
            display: none;
        }

        .cover-page .page-content::after {
            display: none;
        }

        .cover-page {
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            text-align: center;
            background: linear-gradient(135deg, #27ae60 0%, #229954 100%);
            color: white;
            font-family: 'Georgia', serif;
            height: 100%;
            width: 100%;
        }

        .cover-page .page-content {
            background-image: url('golf-cover.png');
            background-size: cover;
            background-position: center;
            background-repeat: no-repeat;
            color: white;
            border: none;
            box-shadow: none;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            position: relative;
            height: 100%;
            width: 100%;
            padding: 40px 20px;
            margin: 0;
        }

        .cover-page .page-content::before {
            content: '';
            position: absolute;
            top: 0;
            left: 0;
            right: 0;
            bottom: 0;
            background: rgba(0, 0, 0, 0.25);
            z-index: 0;
        }

        .cover-page .page-content > * {
            position: relative;
            z-index: 1;
        }

        .cover-page h1 {
            font-size: 42px;
            margin-bottom: 12px;
            text-shadow: 2px 2px 6px rgba(0,0,0,0.4);
            font-weight: 700;
            letter-spacing: -0.5px;
        }

        .cover-page .subtitle {
            font-size: 16px;
            margin-bottom: 40px;
            opacity: 0.95;
            font-weight: 300;
        }

        .cover-page .quick-links {
            display: flex;
            gap: 6px;
            flex-wrap: wrap;
            justify-content: center;
            margin-top: 13px;
        }

        .cover-page .quick-link-btn {
            background: rgba(255,255,255,0.2);
            border: 1px solid rgba(255,255,255,0.3);
            color: white;
            padding: 6px 12px;
            border-radius: 6px;
            cursor: pointer;
            font-size: 11px;
            transition: all 0.3s;
            font-weight: 500;
        }

        .cover-page .quick-link-btn:active {
            transform: scale(0.96);
        }

        .cover-page .quick-link-btn:hover {
            background: rgba(255,255,255,0.35);
            border-color: rgba(255,255,255,0.7);
        }

        .cover-page .author-info {
            display: none;
        }

        .footer-author-info {
            color: white;
            font-size: 10px;
            opacity: 0.85;
            font-weight: 500;
        }

        .section-title {
            text-align: center;
            padding: 60px 20px;
        }

        .section-title h2 {
            font-size: 32px;
            margin-bottom: 30px;
            color: #27ae60;
        }

        .section-links {
            display: flex;
            flex-direction: column;
            gap: 10px;
        }

        .section-link {
            background: #ecf0f1;
            border: 1px solid #bdc3c7;
            padding: 12px 16px;
            border-radius: 4px;
            cursor: pointer;
            transition: all 0.2s;
            text-align: center;
            font-size: 14px;
            color: #27ae60;
        }

        .section-link:hover {
            background: #27ae60;
            color: white;
        }

        .page-content h3 {
            font-size: 24px;
            margin-bottom: 20px;
            color: #27ae60;
            border-bottom: 2px solid #27ae60;
            padding-bottom: 12px;
        }

        .page-content h4 {
            font-size: 16px;
            margin-top: 20px;
            margin-bottom: 10px;
            color: #2c3e50;
            font-weight: bold;
        }

        .page-content p {
            margin-bottom: 12px;
            text-align: justify;
        }

        .page-content ul {
            margin-left: 20px;
            margin-bottom: 12px;
        }

        .page-content li {
            margin-bottom: 6px;
        }

        .modal {
            display: none;
            position: fixed;
            z-index: 1000;
            left: 0;
            top: 0;
            width: 100%;
            height: 100%;
            background-color: rgba(0,0,0,0.5);
            animation: fadeIn 0.3s;
        }

        .modal.active {
            display: block;
        }

        @keyframes fadeIn {
            from { opacity: 0; }
            to { opacity: 1; }
        }

        .modal-content {
            background-color: white;
            margin: 5% auto;
            padding: 30px;
            border-radius: 8px;
            width: 90%;
            max-width: 500px;
            max-height: 80vh;
            overflow-y: auto;
            box-shadow: 0 8px 30px rgba(0,0,0,0.3);
        }

        .modal-header {
            font-size: 20px;
            font-weight: bold;
            margin-bottom: 20px;
            color: #27ae60;
            display: flex;
            justify-content: space-between;
            align-items: center;
        }

        .close-btn {
            background: none;
            border: none;
            font-size: 24px;
            cursor: pointer;
            color: #7f8c8d;
        }

        .close-btn:hover {
            color: #2c3e50;
        }

        .club-list {
            display: flex;
            flex-direction: column;
            gap: 8px;
        }

        .club-item {
            display: flex;
            align-items: center;
            padding: 10px;
            border: 1px solid #ecf0f1;
            border-radius: 4px;
            background: #f8f9fa;
        }

        .club-item input[type="checkbox"] {
            margin-right: 10px;
            cursor: pointer;
            width: 18px;
            height: 18px;
        }

        .club-item label {
            flex: 1;
            cursor: pointer;
            font-size: 14px;
        }

        .club-yardage {
            font-size: 12px;
            color: #7f8c8d;
            margin-left: 10px;
        }

        .yardage-table {
            width: 100%;
            border-collapse: collapse;
            margin-top: 20px;
        }

        .yardage-table th {
            background: #27ae60;
            color: white;
            padding: 10px;
            text-align: left;
            font-size: 12px;
        }

        .yardage-table td {
            padding: 8px;
            border: 1px solid #ecf0f1;
            font-size: 13px;
        }

        .yardage-table tr:nth-child(even) {
            background: #f8f9fa;
        }

        .yardage-input {
            width: 60px;
            padding: 4px;
            border: 1px solid #bdc3c7;
            border-radius: 3px;
            font-size: 12px;
        }

        .modal-buttons {
            display: flex;
            gap: 10px;
            margin-top: 20px;
            justify-content: flex-end;
        }

        .btn {
            padding: 10px 20px;
            border: none;
            border-radius: 4px;
            cursor: pointer;
            font-size: 14px;
            transition: all 0.2s;
        }

        .btn-primary {
            background: #27ae60;
            color: white;
        }

        .btn-primary:hover {
            background: #229954;
        }

        .btn-secondary {
            background: #95a5a6;
            color: white;
        }

        .btn-secondary:hover {
            background: #7f8c8d;
        }

        .swipe-hint {
            position: fixed;
            bottom: 20px;
            left: 50%;
            transform: translateX(-50%);
            background: rgba(0,0,0,0.6);
            color: white;
            padding: 8px 16px;
            border-radius: 20px;
            font-size: 12px;
            pointer-events: none;
            animation: pulse 2s infinite;
        }

        @keyframes pulse {
            0%, 100% { opacity: 0.6; }
            50% { opacity: 1; }
        }

        @media (max-width: 600px) {
            .page-content {
                padding: 30px 20px;
                font-size: 14px;
            }

            .page-content h3 {
                font-size: 20px;
            }

            .cover-page h1 {
                font-size: 36px;
            }

            .header {
                padding: 10px 12px;
            }

            .header-title {
                font-size: 14px;
            }

            .modal-content {
                width: 95%;
                margin: 20% auto;
                padding: 20px;
            }
        }

        .notation {
            background: #ecf0f1;
            padding: 8px 12px;
            border-left: 3px solid #27ae60;
            margin: 12px 0;
            font-size: 13px;
            border-radius: 3px;
        }

        .footer {
            background: linear-gradient(135deg, #2ecc71 0%, #27ae60 100%);
            border-top: 1px solid rgba(0,0,0,0.1);
            padding: 10px 16px;
            display: flex;
            justify-content: space-between;
            align-items: center;
            box-shadow: 0 -2px 8px rgba(0,0,0,0.1);
        }

        .page-counter {
            color: white;
            font-size: 11px;
            font-weight: 600;
            letter-spacing: 0.5px;
        }

        .nav-buttons {
            display: flex;
            gap: 6px;
        }

        .nav-btn {
            background: rgba(255,255,255,0.25);
            border: 1px solid rgba(255,255,255,0.3);
            color: white;
            padding: 6px 12px;
            border-radius: 6px;
            cursor: pointer;
            font-size: 12px;
            font-weight: 600;
            transition: all 0.2s;
        }

        .nav-btn:active {
            transform: scale(0.96);
        }

        .nav-btn:hover {
            background: rgba(255,255,255,0.35);
        }

        .nav-btn:disabled {
            background: rgba(255,255,255,0.1);
            border-color: rgba(255,255,255,0.15);
            cursor: not-allowed;
            opacity: 0.4;
        }
    </style>
</head>
<body>
    <div class="container">
        <div class="header">
            <div class="header-title" id="pageTitle">The Golf Aide Notebook</div>
            <div class="header-buttons">
                <button class="header-btn" id="clubSetupBtn">Setup</button>
                <button class="header-btn" id="yardageBtn">&#128208; Yardage</button>
                <button class="header-btn" id="shotAnalyzerBtn">Shot Analyzer</button>
            </div>
        </div>

        <div class="category-bar" id="categoryBar">
            <button class="category-btn" data-section="0">Home</button>
            <button class="category-btn" data-section="1">Off Tee</button>
            <button class="category-btn" data-section="9">Fairway</button>
            <button class="category-btn" data-section="23">Around Green</button>
            <button class="category-btn" data-section="46">Appendix</button>
        </div>

        <div class="content-area" id="contentArea">
            <!-- Pages will be inserted here -->
        </div>

        <div class="footer">
            <div class="page-counter" id="pageCounter">1 / 44</div>
            <div class="footer-author-info" id="footerAuthorInfo" style="display: none;">
                Personalized for JT • v.3
            </div>
            <div class="nav-buttons">
                <button class="nav-btn" id="prevBtn" onclick="goToPage(currentPage - 1)">← Back</button>
                <button class="nav-btn" id="nextBtn" onclick="goToPage(currentPage + 1)">Next →</button>
            </div>
        </div>
    </div>

    <!-- Club Setup Modal -->
    <div class="modal" id="clubSetupModal">
        <div class="modal-content">
            <div class="modal-header">
                <span>Club Setup</span>
                <button class="close-btn" onclick="closeModal('clubSetupModal')">&times;</button>
            </div>
            <div id="clubList" class="club-list"></div>
            <div class="modal-buttons">
                <button class="btn btn-secondary" onclick="closeModal('clubSetupModal')">Close</button>
                <button class="btn btn-primary" onclick="saveClubSetup()">Save</button>
            </div>
        </div>
    </div>

    <!-- Yardage Modal -->
    <div class="modal" id="yardageModal">
        <div class="modal-content">
            <div class="modal-header">
                <span>Yardage Chart</span>
                <button class="close-btn" onclick="closeModal('yardageModal')">&times;</button>
            </div>
            <div id="yardageContent"></div>
            <div class="modal-buttons">
                <button class="btn btn-secondary" onclick="closeModal('yardageModal')">Close</button>
                <button class="btn btn-primary" onclick="saveYardages()">Save Changes</button>
            </div>
        </div>
    </div>

    <script>
        const CLUBS = [
            { name: 'Driver', carry: 230, total: 250 },
            { name: '3-Wood', carry: 210, total: 225 },
            { name: '3-Hybrid', carry: 200, total: 210 },
            { name: '3-Iron', carry: 195, total: 200 },
            { name: '4-Iron', carry: 185, total: 190 },
            { name: '5-Iron', carry: 175, total: 180 },
            { name: '6-Iron', carry: 165, total: 170 },
            { name: '7-Iron', carry: 155, total: 160 },
            { name: '8-Iron', carry: 145, total: 150 },
            { name: '9-Iron', carry: 135, total: 140 },
            { name: 'PW', carry: 116, total: 120 },
            { name: 'GW (52°)', carry: 110, total: 115 },
            { name: 'SW (56°)', carry: 100, total: 105 },
            { name: 'Putter', carry: 0, total: 0 }
        ];

        const PAGES_DATA = [
            {
                title: 'Cover',
                type: 'cover',
                content: `
                    <div class="cover-page">
                        <div class="page-content cover-page">
                        </div>
                    </div>
                `
            },
            {
                title: 'Off The Tee',
                type: 'section',
                content: `
                    <div class="section-title">
                        <h2>Off The Tee</h2>
                        <p>Distance & Shape Control</p>
                        <div class="section-links">
                            <div class="section-link" onclick="goToPage(2)">High Fade</div>
                            <div class="section-link" onclick="goToPage(3)">High Draw</div>
                            <div class="section-link" onclick="goToPage(4)">Straight Shot</div>
                            <div class="section-link" onclick="goToPage(5)">High Straight</div>
                            <div class="section-link" onclick="goToPage(6)">Low Draw</div>
                            <div class="section-link" onclick="goToPage(7)">Low Cut</div>
                            <div class="section-link" onclick="goToPage(8)">Low Stinger</div>
                        </div>
                    </div>
                `
            },
            {
                title: 'High Fade',
                type: 'shot',
                content: `
                    <div class="page-content">
                        <h3>High Fade</h3>
                        <h4>Recommended Clubs</h4>
                        <p>Driver (230y carry), 3-Wood (210y carry)</p>
                        <h4>Strategy</h4>
                        <p>Tiger's most reliable shot for accuracy and distance control. Flies predictable distance, lands softly. Superior control vs. straight ball.</p>
                        <h4>When to Play</h4>
                        <ul>
                            <li>Narrow fairways requiring accuracy</li>
                            <li>Fairway slopes left-to-right (safe miss)</li>
                            <li>Dogleg right holes</li>
                            <li>Out of bounds left</li>
                        </ul>
                        <h4>Setup</h4>
                        <ul>
                            <li><strong>Ball position:</strong> Slightly forward in stance</li>
                            <li><strong>Alignment:</strong> Feet/body left of target, then swing along that line</li>
                            <li><strong>Weight:</strong> 50/50 at address</li>
                        </ul>
                        <h4>Swing Mechanics (Tiger's Technique)</h4>
                        <ul>
                            <li><strong>The Key:</strong> Limit your release. Don't let your arms release as much as normal through impact</li>
                            <li><strong>Right Arm:</strong> Extend right arm down the target line through impact (crossing over in a draw)</li>
                            <li><strong>Backswing:</strong> Full, smooth rotation</li>
                            <li><strong>Downswing:</strong> Controlled tempo, maintain arm position</li>
                            <li><strong>Follow-through:</strong> Restricted release, balanced finish</li>
                        </ul>
                        <h4>Why This Works</h4>
                        <p>By limiting release and keeping right arm extended, you naturally reduce hook tendency while maintaining draw-fighting characteristics. Result: predictable distance with soft landing.</p>
                        <h4>Common Mistakes</h4>
                        <ul>
                            <li>Releasing fully (turns shot into draw or hook)</li>
                            <li>Over-aiming left (creates slice instead of fade)</li>
                            <li>Swaying laterally instead of rotating</li>
                        </ul>
                    </div>
                `
            },
            {
                title: 'High Draw',
                type: 'shot',
                content: `
                    <div class="page-content">
                        <h3>High Draw</h3>
                        <h4>Recommended Clubs</h4>
                        <p>Driver (230y carry), 3-Wood (210y carry)</p>
                        <h4>Strategy</h4>
                        <p>Distance shot for open fairways. Draw produces longer carry than straight ball and reduces sidespin.</p>
                        <h4>When to Play</h4>
                        <ul>
                            <li>Dogleg left holes</li>
                            <li>Out of bounds right (protected)</li>
                            <li>Fairway slopes right-to-left</li>
                            <li>When maximum distance needed</li>
                        </ul>
                        <h4>Setup (Tiger's Method)</h4>
                        <ul>
                            <li><strong>Right foot:</strong> Drop back further than normal (more closed stance)</li>
                            <li><strong>Tee height:</strong> Higher than usual</li>
                            <li><strong>Weight:</strong> 50/50 at address</li>
                            <li><strong>Key:</strong> Physical readiness matters[-]if spine/mobility is tight, fade becomes easier than draw</li>
                        </ul>
                        <h4>Swing Mechanics (Tiger's Approach)</h4>
                        <ul>
                            <li><strong>Club face:</strong> Keep clubface open relative to target</li>
                            <li><strong>Swing path:</strong> Inside-to-out (relative to target line)</li>
                            <li><strong>The magic:</strong> Face closed relative to swing path = right-to-left curve</li>
                            <li><strong>Backswing:</strong> Full shoulder turn, generate coil</li>
                            <li><strong>Downswing:</strong> Drive from ground up, maintain inside path</li>
                        </ul>
                        <h4>Technical Note</h4>
                        <p>Tiger emphasizes: "Clubface angle determines where ball starts; swing path determines spin." A proper draw requires an inside-to-out path with face closed relative to that path.</p>
                        <h4>Common Mistakes</h4>
                        <ul>
                            <li>Closing face at setup (prevents inside-to-out path)</li>
                            <li>Swinging too hard (promotes weak fade or slice)</li>
                            <li>Over-compensating with hand position (leads to hooks)</li>
                        </ul>
                    </div>
                `
            },
            {

                row.innerHTML = `
                    <td>${club.name}</td>
                    <td>${club.carry}y</td>
                    <td>${club.total}y</td>
                `;
                tbody.appendChild(row);
            });
        }

        function openModal(modalId) {
            document.getElementById(modalId).classList.add('active');
        }

        function closeModal(modalId) {
            document.getElementById(modalId).classList.remove('active');
        }

        function saveClubSetup() {
            activeClubs = [];
            document.querySelectorAll('#clubList input[type="checkbox"]').forEach((checkbox, index) => {
                if (checkbox.checked) {
                    activeClubs.push(index);
                }
            });
            localStorage.setItem('activeClubs', JSON.stringify(activeClubs));
            closeModal('clubSetupModal');
        }

        function loadClubSetup() {
            const saved = localStorage.getItem('activeClubs');
            if (saved) {
                activeClubs = JSON.parse(saved);
            } else {
                activeClubs = Array.from(Array(CLUBS.length).keys());
                localStorage.setItem('activeClubs', JSON.stringify(activeClubs));
            }
        }

        function saveYardages() {
            closeModal('yardageModal');
        }

        function toggleTips(button) {
            const tipsContent = button.nextElementSibling;
            if (tipsContent && tipsContent.classList.contains('tips-content')) {
                tipsContent.classList.toggle('expanded');
                button.textContent = tipsContent.classList.contains('expanded') ? 'ℹ️ Hide Tips' : 'ℹ️ Show Tips';
            }
        }

        // Shot Analyzer Functions
        function getSASwingOptions(club, distance) {
            const swingOptions = {
                'Driver': ['Soft drive', 'Full driver'],
                'Hybrid': ['Soft hybrid', 'Full hybrid'],
                '3-Wood': ['Soft 3W', 'Full 3W'],
                '5-Iron': ['Soft 6', 'Full 5'],
                '6-Iron': ['Soft 7', 'Full 6'],
                '7-Iron': ['Soft 8', 'Full 7'],
                '8-Iron': ['Soft 9', 'Full 8'],
                '9-Iron': ['Soft PW', 'Full 9'],
                'PW': ['Soft PW', 'Full PW']
            };
            return swingOptions[club] || ['Soft', 'Full'];
        }

        function getSAShotType(location, distance, wind, lie) {
            if (location === 'tee' && distance > 200) return 'drive';
            if (distance <= 50 && lie === 'clean') return 'chip';
            if (distance <= 100 && lie === 'clean') return 'approach';
            if (location === 'rough' || lie === 'thick') return 'recovery';
            if (wind === 'strong') return 'punch';
            return 'standard';
        }

        // Shot Analyzer Functions
        function getSAClubForDistance(distance, location) {
            if (location === 'tee') {
                if (distance >= 220) return 'Driver';
                if (distance >= 190) return 'Hybrid';
                if (distance >= 150) return '3-Wood';
            } else if (location === 'fairway') {
                if (distance >= 180) return '5-Iron';
                if (distance >= 140) return '7-Iron';
                if (distance >= 100) return '9-Iron';
                if (distance >= 70) return 'PW';
            } else if (location === 'rough') {
                if (distance >= 140) return '6-Iron';
                if (distance >= 90) return '8-Iron';
                if (distance >= 60) return 'PW';
            }
            return 'PW';
        }

        function getSACarryDistance(club, distance) {
            const carryPercent = {
                'Driver': 0.95, 'Hybrid': 0.92, '3-Wood': 0.90,
                '5-Iron': 0.85, '6-Iron': 0.84, '7-Iron': 0.82, '8-Iron': 0.80, '9-Iron': 0.78,
                'PW': 0.75
            };
            const percent = carryPercent[club] || 0.75;
            return Math.round(distance * percent);
        }

        function getSATotalDistance(carry, lie, greenTopo) {
            let rollPercent = 0.15;
            if (lie === 'thick') rollPercent = 0.05;
            else if (lie === 'tight') rollPercent = 0.20;
            else if (lie === 'clean') rollPercent = 0.18;
            if (greenTopo === 'running-away') rollPercent += 0.08;
            else if (greenTopo === 'uphill') rollPercent -= 0.05;
            rollPercent = Math.max(0.02, rollPercent);
            const roll = Math.round(carry * rollPercent);
            return carry + roll;
        }

        function updateShotAnalyzer() {
            const location = document.getElementById('sa-location').value;
            const distance = parseInt(document.getElementById('sa-distance').value) || 0;
            const lie = document.getElementById('sa-lie').value;
            const elev = parseInt(document.getElementById('sa-elev').value) || 0;
            const wind = document.getElementById('sa-wind').value;
            const winddir = document.getElementById('sa-winddir').value;
            const green = document.getElementById('sa-green').value;

            if (!location || distance <= 0) {
                document.getElementById('sa-result').style.display = 'none';
                return;
            }

            let club = getSAClubForDistance(distance, location);
            let adjustedDistance = distance;

            if (elev > 0) adjustedDistance -= Math.abs(elev) * 2;
            else if (elev < 0) adjustedDistance += Math.abs(elev) * 1.5;

            if (wind === 'strong') {
                if (winddir === 'headwind') adjustedDistance += 20;
                else if (winddir === 'tailwind') adjustedDistance -= 15;
            } else if (wind === 'moderate') {
                if (winddir === 'headwind') adjustedDistance += 10;
                else if (winddir === 'tailwind') adjustedDistance -= 8;
            }

            const carry = getSACarryDistance(club, adjustedDistance);
            const total = getSATotalDistance(carry, lie, green);

            document.getElementById('sa-club').textContent = club;

            // Add swing options
            const swings = getSASwingOptions(club, adjustedDistance);
            document.getElementById('sa-swings').textContent = 'Swings: ' + swings.join(' / ');

            document.getElementById('sa-carry-val').textContent = carry + 'y';
            document.getElementById('sa-total-val').textContent = total + 'y';

            let strategy = 'Execute with commitment.';
            if (location === 'tee' && distance > 150) strategy = 'Maximize distance. Smooth tempo.';
            else if (location === 'fairway' && distance > 100) strategy = 'Accuracy over distance. Land center green.';
            else if (distance <= 50) strategy = distance > 20 ? 'Land soft, control distance.' : 'Land short, roll to hole.';

            if (elev > 0) strategy += ' Uphill[-]club adjusted.';
            if (wind === 'strong') strategy += ' Strong wind[-]club adjusted.';

            document.getElementById('sa-strategy').textContent = strategy;

            // Add shot type guidance links
            const shotType = getSAShotType(location, distance, wind, lie);
            let links = '';
            if (shotType === 'punch') {
                const punchIdx = PAGES_DATA.findIndex(p => p.title === 'Punch Pitch');
                if (punchIdx !== -1) links = '📖 <a href="#" onclick="goToPage(' + punchIdx + ')">Punch Pitch Guide</a>';
            }

            if (links) document.getElementById('sa-links').innerHTML = links;
            else document.getElementById('sa-links').innerHTML = '';

            document.getElementById('sa-result').style.display = 'block';
        }

        function resetShotAnalyzer() {
            document.getElementById('sa-location').value = '';
            document.getElementById('sa-distance').value = '';
            document.getElementById('sa-lie').value = '';
            document.getElementById('sa-elev').value = '';
            document.getElementById('sa-wind').value = 'none';
            document.getElementById('sa-winddir').value = 'none';
            document.getElementById('sa-green').value = '';
            document.getElementById('sa-result').style.display = 'none';
        }

        document.getElementById('clubSetupBtn').addEventListener('click', function() {
            populateClubList();
            openModal('clubSetupModal');
        });

        document.getElementById('yardageBtn').addEventListener('click', function() {
            openModal('yardageModal');
        });

        document.getElementById('shotAnalyzerBtn').addEventListener('click', function() {
            const idx = PAGES_DATA.findIndex(p => p.title === 'Shot Analyzer');
            if (idx !== -1) {
                goToPage(idx);
            }
        });

        window.addEventListener('click', function(event) {
            const clubModal = document.getElementById('clubSetupModal');
            const yardageModal = document.getElementById('yardageModal');
            if (event.target == clubModal) {
                closeModal('clubSetupModal');
            }
            if (event.target == yardageModal) {
                closeModal('yardageModal');
            }
        });

        initializeApp();
    </script>
</body>
</html>
