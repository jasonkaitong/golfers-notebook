<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Golfer's Notebook</title>
    <link href="https://fonts.googleapis.com/css2?family=Caveat:wght@400;700&family=Crimson+Text:ital@0;1&display=swap" rel="stylesheet">
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        :root {
            --cream: #f5f1e8;
            --dark-text: #2c2c2c;
            --green: #4a7c59;
            --line-color: #d4cfc4;
            --shadow: rgba(0,0,0,0.15);
        }

        body {
            font-family: 'Crimson Text', serif;
            background: #333;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            padding: 10px;
            color: var(--dark-text);
        }

        .notebook-container {
            width: 100%;
            max-width: 420px;
            aspect-ratio: 0.6;
            background: var(--cream);
            border-radius: 8px;
            box-shadow: 0 20px 60px var(--shadow), inset 0 1px 0 rgba(255,255,255,0.6);
            display: flex;
            flex-direction: column;
            overflow: hidden;
            position: relative;
            font-size: 14px;
        }

        /* Spiral binding at top */
        .spiral-binding {
            position: absolute;
            top: 0;
            left: 0;
            right: 0;
            height: 20px;
            background: repeating-linear-gradient(
                90deg,
                transparent,
                transparent 8px,
                var(--green) 8px,
                var(--green) 10px
            );
            z-index: 100;
            border-bottom: 1px solid rgba(0,0,0,0.1);
        }

        /* Category bar */
        .category-bar {
            padding: 12px 8px 8px;
            background: rgba(74, 124, 89, 0.08);
            border-bottom: 1px solid var(--line-color);
            overflow-x: auto;
            display: flex;
            gap: 6px;
            margin-top: 20px;
            flex-shrink: 0;
            font-size: 12px;
        }

        .category-btn {
            white-space: nowrap;
            padding: 4px 12px;
            background: rgba(255,255,255,0.7);
            border: 1px solid var(--line-color);
            border-radius: 12px;
            cursor: pointer;
            font-family: 'Caveat', cursive;
            font-size: 13px;
            font-weight: 700;
            transition: all 0.2s;
            flex-shrink: 0;
        }

        .category-btn:hover {
            background: var(--green);
            color: white;
            border-color: var(--green);
        }

        .category-btn.active {
            background: var(--green);
            color: white;
            border-color: var(--green);
        }

        /* Page container */
        .page-container {
            flex: 1;
            overflow: hidden;
            position: relative;
            display: flex;
            flex-direction: column;
        }

        .page {
            position: absolute;
            width: 100%;
            height: 100%;
            background: var(--cream);
            background-image:
                repeating-linear-gradient(
                    0deg,
                    var(--line-color) 0px,
                    var(--line-color) 1px,
                    transparent 1px,
                    transparent 24px
                );
            background-position: 0 30px;
            background-size: 100% 24px;
            padding: 30px 16px 16px;
            overflow-y: auto;
            transition: transform 0.4s cubic-bezier(0.25, 0.46, 0.45, 0.94);
            opacity: 0;
        }

        .page.active {
            opacity: 1;
            transform: translateY(0);
            z-index: 10;
        }

        .page.entering-up {
            transform: translateY(100%);
        }

        .page.entering-down {
            transform: translateY(-100%);
        }

        .page.exiting-up {
            transform: translateY(-100%);
            z-index: 5;
        }

        .page.exiting-down {
            transform: translateY(100%);
            z-index: 5;
        }

        /* Page content */
        .page h1 {
            font-family: 'Caveat', cursive;
            font-size: 32px;
            font-weight: 700;
            margin-bottom: 12px;
            color: var(--green);
        }

        .page h2 {
            font-family: 'Caveat', cursive;
            font-size: 24px;
            font-weight: 700;
            margin: 16px 0 10px;
            color: var(--green);
            margin-top: 20px;
        }

        .page h3 {
            font-family: 'Caveat', cursive;
            font-size: 18px;
            font-weight: 700;
            margin: 12px 0 8px;
            color: var(--dark-text);
        }

        .page p, .page li {
            font-size: 13px;
            line-height: 1.6;
            margin: 6px 0;
        }

        .page ul {
            margin-left: 16px;
            margin: 6px 0 6px 16px;
        }

        .page li {
            margin: 4px 0;
        }

        .section-title-content {
            text-align: center;
            padding: 60px 20px;
        }

        .section-title-content h1 {
            font-size: 42px;
            margin-bottom: 20px;
        }

        .section-links {
            display: flex;
            flex-direction: column;
            gap: 8px;
            margin-top: 30px;
        }

        .section-link-btn {
            padding: 10px 16px;
            background: rgba(74, 124, 89, 0.15);
            border: 2px solid var(--green);
            border-radius: 6px;
            cursor: pointer;
            font-family: 'Caveat', cursive;
            font-size: 16px;
            font-weight: 700;
            color: var(--green);
            transition: all 0.2s;
        }

        .section-link-btn:hover {
            background: var(--green);
            color: white;
        }

        .cover-page {
            text-align: center;
            padding: 80px 20px 40px;
            display: flex;
            flex-direction: column;
            justify-content: center;
        }

        .cover-page h1 {
            font-size: 48px;
            margin-bottom: 10px;
        }

        .cover-page .subtitle {
            font-size: 20px;
            font-style: italic;
            margin-bottom: 60px;
            color: var(--green);
        }

        .cover-buttons {
            display: flex;
            gap: 12px;
            justify-content: center;
            margin-top: 40px;
            flex-wrap: wrap;
        }

        .cover-btn {
            padding: 10px 16px;
            background: var(--green);
            color: white;
            border: none;
            border-radius: 6px;
            cursor: pointer;
            font-family: 'Caveat', cursive;
            font-size: 16px;
            font-weight: 700;
            transition: all 0.2s;
        }

        .cover-btn:hover {
            background: #3d6546;
            transform: scale(1.05);
        }

        /* Controls */
        .controls {
            padding: 12px 16px;
            background: rgba(74, 124, 89, 0.08);
            border-top: 1px solid var(--line-color);
            display: flex;
            justify-content: space-between;
            align-items: center;
            font-size: 12px;
            flex-shrink: 0;
        }

        .page-counter {
            font-family: 'Caveat', cursive;
            font-size: 14px;
            font-weight: 700;
        }

        .nav-buttons {
            display: flex;
            gap: 8px;
        }

        .nav-btn {
            padding: 6px 12px;
            background: white;
            border: 1px solid var(--line-color);
            border-radius: 4px;
            cursor: pointer;
            font-family: 'Caveat', cursive;
            font-weight: 700;
            transition: all 0.2s;
        }

        .nav-btn:hover {
            background: var(--green);
            color: white;
            border-color: var(--green);
        }

        /* Modal */
        .modal {
            display: none;
            position: fixed;
            z-index: 200;
            left: 0;
            top: 0;
            width: 100%;
            height: 100%;
            background-color: rgba(0,0,0,0.6);
            padding: 20px;
        }

        .modal.active {
            display: flex;
            justify-content: center;
            align-items: center;
        }

        .modal-content {
            background-color: var(--cream);
            border-radius: 8px;
            padding: 24px;
            max-width: 400px;
            max-height: 80vh;
            overflow-y: auto;
            box-shadow: 0 10px 40px var(--shadow);
            width: 100%;
        }

        .modal-content h2 {
            margin-top: 0;
        }

        .club-list {
            display: flex;
            flex-direction: column;
            gap: 10px;
            margin: 16px 0;
        }

        .club-item {
            display: flex;
            align-items: center;
            gap: 10px;
            padding: 8px;
            background: rgba(255,255,255,0.5);
            border-radius: 4px;
        }

        .club-item input[type="checkbox"] {
            width: 18px;
            height: 18px;
            cursor: pointer;
        }

        .club-item label {
            cursor: pointer;
            flex: 1;
            font-size: 14px;
        }

        .yardage-row {
            display: flex;
            gap: 10px;
            align-items: center;
            margin: 12px 0;
            padding: 8px;
            background: rgba(255,255,255,0.5);
            border-radius: 4px;
        }

        .yardage-row label {
            font-weight: 700;
            font-size: 13px;
            min-width: 80px;
        }

        .yardage-row input {
            width: 60px;
            padding: 4px 8px;
            border: 1px solid var(--line-color);
            border-radius: 4px;
            font-size: 12px;
        }

        .modal-buttons {
            display: flex;
            gap: 10px;
            margin-top: 20px;
        }

        .modal-btn {
            flex: 1;
            padding: 10px;
            border: none;
            border-radius: 4px;
            cursor: pointer;
            font-family: 'Caveat', cursive;
            font-weight: 700;
            font-size: 14px;
            transition: all 0.2s;
        }

        .modal-btn.primary {
            background: var(--green);
            color: white;
        }

        .modal-btn.primary:hover {
            background: #3d6546;
        }

        .modal-btn.secondary {
            background: #ddd;
            color: var(--dark-text);
        }

        .modal-btn.secondary:hover {
            background: #ccc;
        }

        .close-btn {
            float: right;
            font-size: 28px;
            font-weight: bold;
            cursor: pointer;
            color: var(--green);
            background: none;
            border: none;
            padding: 0;
            width: 28px;
            height: 28px;
        }

        .close-btn:hover {
            color: #3d6546;
        }

        /* Swipe indicator */
        .swipe-hint {
            position: absolute;
            bottom: 50px;
            left: 50%;
            transform: translateX(-50%);
            font-size: 11px;
            color: rgba(0,0,0,0.3);
            pointer-events: none;
            animation: fade-in-out 3s ease-in-out infinite;
        }

        @keyframes fade-in-out {
            0%, 100% { opacity: 0; }
            50% { opacity: 1; }
        }

        /* Shot content box */
        .shot-box {
            background: rgba(74, 124, 89, 0.05);
            padding: 12px;
            border-left: 3px solid var(--green);
            margin: 12px 0;
            border-radius: 2px;
        }

        .shot-meta {
            font-size: 12px;
            color: #666;
            margin: 8px 0 12px;
            font-style: italic;
        }

        .finish-note {
            font-size: 12px;
            color: var(--green);
            font-weight: 700;
            margin-top: 10px;
            padding-top: 10px;
            border-top: 1px dashed var(--line-color);
        }

        /* Responsive */
        @media (max-width: 480px) {
            .notebook-container {
                border-radius: 4px;
            }

            .page h1 {
                font-size: 28px;
            }

            .cover-page h1 {
                font-size: 40px;
            }
        }
    </style>
</head>
<body>
    <div class="notebook-container">
        <div class="spiral-binding"></div>

        <div class="category-bar" id="categoryBar">
            <!-- Categories populated by JavaScript -->
        </div>

        <div class="page-container" id="pageContainer">
            <!-- Pages populated by JavaScript -->
        </div>

        <div class="controls">

                <button class="modal-btn primary" onclick="saveClubSetup()">Save</button>
                <button class="modal-btn secondary" onclick="closeClubModal()">Cancel</button>
            </div>
        </div>
    </div>

    <!-- Yardage Modal -->

                <button class="modal-btn primary" onclick="saveYardages()">Save</button>
                <button class="modal-btn secondary" onclick="closeYardageModal()">Cancel</button>
            </div>
        </div>
    </div>

        // ====================
        // APP STATE
        // ====================

        let currentPageIndex = 0;
        let userClubs = JSON.parse(localStorage.getItem('golfClubs')) || {};
        let userYardages = JSON.parse(localStorage.getItem('golfYardages')) || {};

        // Initialize user clubs with defaults
        Object.keys(JT_CLUBS).forEach(club => {
            if (!userClubs[club]) {
                userClubs[club] = JT_CLUBS[club].default;
            }
        });

        // Page order
        const PAGE_ORDER = [
            'home',
            'tee-title',
            'high-fade', 'high-draw', 'straight', 'high-straight', 'low-draw', 'low-cut', 'low-stinger',
            'fairway-title',
            'uphill-lie', 'downhill-lie', 'fade-fairway', 'draw-fairway', 'fairway-bunker',
            'green-title',
            'tight-chip', 'fluffy-chip', 'check-run', 'pitch-shot', 'flop-shot', 'bunker-low', 'bunker-high',
            'utilities-title'
        ];

        // ====================
        // INITIALIZATION
        // ====================

        function init() {
            renderPages();
            renderCategoryBar();
            goToPage(0);
            setupSwipeListener();
            updatePageCounter();
        }

        function renderPages() {
            const container = document.getElementById('pageContainer');
            container.innerHTML = '';

            PAGE_ORDER.forEach((pageKey, index) => {
                const data = SHOT_DATA[pageKey];
                const page = document.createElement('div');
                page.className = 'page';
                page.id = `page-${index}`;

                if (data.type === 'cover') {
                    page.innerHTML = data.content;
                } else if (data.type === 'section-title') {
                    let linksHtml = data.links.map(link =>
                        `<button class="section-link-btn" onclick="jumpToShot('${link}')">${link}</button>`
                    ).join('');
                    page.innerHTML = `
                        <div class="section-title-content">
                            <h1>${data.title}</h1>
                            <div class="section-links">${linksHtml}</div>
                        </div>
                    `;
                } else {
                    page.innerHTML = data.content;
                }

                container.appendChild(page);
            });
        }

        function renderCategoryBar() {
            const bar = document.getElementById('categoryBar');
            const categories = ['OFF TEE', 'FROM FAIRWAY', 'AROUND GREEN', 'UTILITIES'];

            bar.innerHTML = categories.map(cat =>
                `<button class="category-btn" onclick="jumpToCategory('${cat}')">${cat}</button>`
            ).join('');
        }

        function goToPage(index) {
            const pages = document.querySelectorAll('.page');

            pages.forEach((page, i) => {
                page.classList.remove('active', 'entering-up', 'entering-down', 'exiting-up', 'exiting-down');

                if (i === index) {
                    page.classList.add('active');
                }
            });

            currentPageIndex = index;
            updatePageCounter();
            updateCategoryBar();
        }

        function nextPage() {
            if (currentPageIndex < PAGE_ORDER.length - 1) {
                goToPage(currentPageIndex + 1);
            }
        }

        function prevPage() {
            if (currentPageIndex > 0) {
                goToPage(currentPageIndex - 1);
            }
        }

        function updatePageCounter() {
            document.getElementById('pageNum').textContent = currentPageIndex + 1;
            document.getElementById('totalPages').textContent = PAGE_ORDER.length;
        }

        function updateCategoryBar() {
            const currentData = SHOT_DATA[PAGE_ORDER[currentPageIndex]];
            const currentCategory = currentData?.category || null;

            document.querySelectorAll('.category-btn').forEach(btn => {
                btn.classList.remove('active');
                if (btn.textContent === currentCategory) {
                    btn.classList.add('active');
                }
            });
        }

        function jumpToCategory(category) {
            const index = PAGE_ORDER.findIndex(key => {
                const data = SHOT_DATA[key];
                return data.category === category && data.type === 'section-title';
            });
            if (index !== -1) goToPage(index);
        }

        function jumpToShot(shotName) {
            const index = PAGE_ORDER.findIndex(key => {
                const data = SHOT_DATA[key];
                return data.title && data.title.includes(shotName);
            });
            if (index !== -1) goToPage(index);
        }

        // ====================
        // SWIPE HANDLING
        // ====================

        let touchStartY = 0;
        let touchEndY = 0;

        function setupSwipeListener() {
            const container = document.getElementById('pageContainer');

            container.addEventListener('touchstart', e => {
                touchStartY = e.changedTouches[0].screenY;
            }, false);

            container.addEventListener('touchend', e => {
                touchEndY = e.changedTouches[0].screenY;
                handleSwipe();
            }, false);
        }

        function handleSwipe() {
            const diff = touchStartY - touchEndY;
            if (Math.abs(diff) > 50) {
                if (diff > 0) {
                    nextPage();
                } else {
                    prevPage();
                }
            }
        }

        // ====================
        // CLUB SETUP MODAL
        // ====================

        function openClubModal() {
            const list = document.getElementById('clubList');
            list.innerHTML = Object.keys(JT_CLUBS).map(club => `
                <div class="club-item">
                    <input type="checkbox" id="club-${club}" ${userClubs[club] ? 'checked' : ''}>
                    <label for="club-${club}">${club}</label>
                </div>
            `).join('');

            document.getElementById('clubModal').classList.add('active');
        }

        function closeClubModal() {
            document.getElementById('clubModal').classList.remove('active');
        }

        function saveClubSetup() {
            Object.keys(JT_CLUBS).forEach(club => {
                userClubs[club] = document.getElementById(`club-${club}`).checked;
            });
            localStorage.setItem('golfClubs', JSON.stringify(userClubs));
            closeClubModal();
        }

        // ====================
        // YARDAGE MODAL
        // ====================

        function openYardageModal() {
            const list = document.getElementById('yardageList');
            list.innerHTML = Object.entries(JT_CLUBS).map(([club, data]) => `
                <div class="yardage-row">
                    <label>${club}</label>
                    <input type="number" id="carry-${club}" placeholder="Carry" value="${userYardages[club + '-carry'] || data.carry}">
                    <span>/</span>
                    <input type="number" id="total-${club}" placeholder="Total" value="${userYardages[club + '-total'] || data.total}">
                </div>
            `).join('');

            document.getElementById('yardageModal').classList.add('active');
        }

        function closeYardageModal() {
            document.getElementById('yardageModal').classList.remove('active');
        }

        function saveYardages() {
            Object.keys(JT_CLUBS).forEach(club => {
                const carry = document.getElementById(`carry-${club}`).value || JT_CLUBS[club].carry;
                const total = document.getElementById(`total-${club}`).value || JT_CLUBS[club].total;
                userYardages[club + '-carry'] = carry;
                userYardages[club + '-total'] = total;
            });
            localStorage.setItem('golfYardages', JSON.stringify(userYardages));
            closeYardageModal();
        }

        // ====================
        // EVENT LISTENERS
        // ====================

        document.getElementById('nextBtn').addEventListener('click', nextPage);
        document.getElementById('prevBtn').addEventListener('click', prevPage);

        // Keyboard navigation
        document.addEventListener('keydown', e => {
            if (e.key === 'ArrowUp' || e.key === 'ArrowLeft') prevPage();
            if (e.key === 'ArrowDown' || e.key === 'ArrowRight') nextPage();
        });

        // Close modals on backdrop click
        document.getElementById('clubModal').addEventListener('click', e => {
            if (e.target.id === 'clubModal') closeClubModal();
        });

        document.getElementById('yardageModal').addEventListener('click', e => {
            if (e.target.id === 'yardageModal') closeYardageModal();
        });

        // Start app
        window.addEventListener('load', init);
    </script>
