<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Golfer's Notebook</title>
    <link href="https://fonts.googleapis.com/css2?family=Caveat:wght@400;700&family=Crimson+Text:ital@0;1&display=swap" rel="stylesheet">
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        :root {
            --cream: #f5f1e8;
            --dark-text: #2c2c2c;
            --green: #6b9e7a;
            --green-dark: #4a7c59;
            --line-color: #d4cfc4;
        }

        body {
            font-family: 'Crimson Text', serif;
            background: #333;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            padding: 10px;
            color: var(--dark-text);
        }

        .notebook-container {
            width: 100%;
            max-width: 420px;
            aspect-ratio: 0.6;
            background: var(--cream);
            border-radius: 8px;
            box-shadow: 0 20px 60px rgba(0,0,0,0.15);
            display: flex;
            flex-direction: column;
            overflow: hidden;
            position: relative;
        }

        .page {
            flex: 1;
            padding: 40px 20px;
            overflow-y: auto;
            display: none;
        }

        .page.active {
            display: block;
        }

        h1 {
            font-family: 'Caveat', cursive;
            font-size: 36px;
            margin-bottom: 20px;
        }

        .controls {
            padding: 12px 16px;
            background: rgba(74, 124, 89, 0.08);
            border-top: 1px solid var(--line-color);
            display: flex;
            justify-content: space-between;
            align-items: center;
            font-size: 12px;
        }

        .nav-btn {
            padding: 6px 12px;
            background: white;
            border: 1px solid var(--line-color);
            border-radius: 4px;
            cursor: pointer;
            font-family: 'Caveat', cursive;
            font-weight: 700;
            transition: all 0.2s;
        }

        .nav-btn:hover {
            background: var(--green);
            color: white;
            border-color: var(--green);
        }
    </style>
</head>
<body>
    <div class="notebook-container">
        <div class="page active">
            <h1>Golfer's Notebook</h1>
            <p>Interactive golf instruction notebook</p>
            <p style="margin-top: 20px; color: #666;">✓ App is loading...</p>
        </div>

        <div class="controls">
            <div id="pageNum">1 / 43</div>
            <div>
                <button class="nav-btn" onclick="alert('← Back')">← Back</button>
                <button class="nav-btn" onclick="alert('Next →')">Next →</button>
            </div>
        </div>
    </div>

    <script>
        console.log('App loaded successfully!');
    </script>
</body>
</html>
