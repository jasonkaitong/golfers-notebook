<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Golfer's Notebook</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background: #2c3e50;
            color: #2c3e50;
            height: 100vh;
            overflow: hidden;
        }

        .container {
            width: 100%;
            height: 100vh;
            display: flex;
            flex-direction: column;
        }

        .header {
            background: #27ae60;
            color: white;
            padding: 12px 16px;
            display: flex;
            justify-content: space-between;
            align-items: center;
            box-shadow: 0 2px 8px rgba(0,0,0,0.2);
        }

        .header-title {
            font-size: 16px;
            font-weight: bold;
        }

        .header-buttons {
            display: flex;
            gap: 8px;
        }

        .header-btn {
            background: rgba(255,255,255,0.2);
            border: none;
            color: white;
            padding: 6px 12px;
            border-radius: 4px;
            cursor: pointer;
            font-size: 14px;
            transition: background 0.2s;
        }

        .header-btn:hover {
            background: rgba(255,255,255,0.3);
        }

        .category-bar {
            background: #27ae60;
            border-top: 1px solid #229954;
            border-bottom: 1px solid #229954;
            overflow-x: auto;
            overflow-y: hidden;
            padding: 8px 0;
            display: flex;
            gap: 8px;
            padding-left: 8px;
            padding-right: 8px;
        }

        .category-btn {
            background: rgba(255,255,255,0.1);
            border: 1px solid rgba(255,255,255,0.3);
            color: white;
            padding: 6px 14px;
            border-radius: 20px;
            cursor: pointer;
            white-space: nowrap;
            font-size: 12px;
            transition: all 0.2s;
            flex-shrink: 0;
        }

        .category-btn.active {
            background: rgba(255,255,255,0.3);
            border: 1px solid rgba(255,255,255,0.5);
        }

        .category-btn:hover {
            background: rgba(255,255,255,0.2);
        }

        .content-area {
            flex: 1;
            overflow: hidden;
            position: relative;
            display: flex;
            flex-direction: column;
        }

        .page {
            position: absolute;
            width: 100%;
            height: 100%;
            background: linear-gradient(135deg, #f5f7fa 0%, #c3cfe2 100%);
            background-attachment: fixed;
            padding: 20px;
            overflow-y: auto;
            display: none;
            opacity: 0;
            transition: opacity 0.3s ease-in-out;
            box-shadow: inset 0 0 40px rgba(0,0,0,0.1);
        }

        .page.active {
            display: block;
            opacity: 1;
            z-index: 1;
        }

        .page.prev {
            z-index: 0;
        }

        .page-content {
            max-width: 600px;
            margin: 0 auto;
            background: white;
            padding: 40px 30px;
            border-radius: 8px;
            box-shadow: 0 4px 20px rgba(0,0,0,0.15);
            position: relative;
            min-height: calc(100% - 40px);
            background-image:
                repeating-linear-gradient(
                    to bottom,
                    transparent,
                    transparent 29px,
                    #e8e8e8 29px,
                    #e8e8e8 30px
                );
            background-position: 0 40px;
            font-family: 'Georgia', serif;
            line-height: 1.6;
        }

        .page-content::before {
            content: '';
            position: absolute;
            left: 0;
            top: 0;
            bottom: 0;
            width: 50px;
            background: repeating-linear-gradient(
                to bottom,
                #27ae60 0px,
                #27ae60 2px,
                transparent 2px,
                transparent 8px
            );
            border-radius: 8px 0 0 8px;
        }

        .cover-page {
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            text-align: center;
            background: linear-gradient(135deg, #27ae60 0%, #229954 100%);
            color: white;
            font-family: 'Georgia', serif;
        }

        .cover-page .page-content {
            background-image: url('golf-cover.png');
            background-size: cover;
            background-position: center;
            background-repeat: no-repeat;
            color: white;
            border: 3px solid #1e8449;
            box-shadow: 0 8px 30px rgba(0,0,0,0.3);
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            position: relative;
        }

        .cover-page .page-content::before {
            content: '';
            position: absolute;
            top: 0;
            left: 0;
            right: 0;
            bottom: 0;
            background: rgba(0, 0, 0, 0.3);
            border-radius: 8px;
            z-index: 0;
        }

        .cover-page .page-content > * {
            position: relative;
            z-index: 1;
        }

        .cover-page h1 {
            font-size: 48px;
            margin-bottom: 16px;
            text-shadow: 2px 2px 4px rgba(0,0,0,0.3);
        }

        .cover-page .subtitle {
            font-size: 20px;
            margin-bottom: 40px;
            opacity: 0.95;
        }

        .cover-page .quick-links {
            display: flex;
            gap: 12px;
            flex-wrap: wrap;
            justify-content: center;
        }

        .cover-page .quick-link-btn {
            background: rgba(255,255,255,0.2);
            border: 2px solid rgba(255,255,255,0.4);
            color: white;
            padding: 10px 20px;
            border-radius: 6px;
            cursor: pointer;
            font-size: 14px;
            transition: all 0.3s;
        }

        .cover-page .quick-link-btn:hover {
            background: rgba(255,255,255,0.3);
            border-color: rgba(255,255,255,0.6);
        }

        .cover-page .author-info {
            margin-top: 40px;
            font-size: 14px;
            opacity: 0.85;
        }

        .section-title {
            text-align: center;
            padding: 60px 20px;
        }

        .section-title h2 {
            font-size: 32px;
            margin-bottom: 30px;
            color: #27ae60;
        }

        .section-links {
            display: flex;
            flex-direction: column;
            gap: 10px;
        }

        .section-link {
            background: #ecf0f1;
            border: 1px solid #bdc3c7;
            padding: 12px 16px;
            border-radius: 4px;
            cursor: pointer;
            transition: all 0.2s;
            text-align: center;
            font-size: 14px;
            color: #27ae60;
        }

        .section-link:hover {
            background: #27ae60;
            color: white;
        }

        .page-content h3 {
            font-size: 24px;
            margin-bottom: 20px;
            color: #27ae60;
            border-bottom: 2px solid #27ae60;
            padding-bottom: 12px;
        }

        .page-content h4 {
            font-size: 16px;
            margin-top: 20px;
            margin-bottom: 10px;
            color: #2c3e50;
            font-weight: bold;
        }

        .page-content p {
            margin-bottom: 12px;
            text-align: justify;
        }

        .page-content ul {
            margin-left: 20px;
            margin-bottom: 12px;
        }

        .page-content li {
            margin-bottom: 6px;
        }

        .modal {
            display: none;
            position: fixed;
            z-index: 1000;
            left: 0;
            top: 0;
            width: 100%;
            height: 100%;
            background-color: rgba(0,0,0,0.5);
            animation: fadeIn 0.3s;
        }

        .modal.active {
            display: block;
        }

        @keyframes fadeIn {
            from { opacity: 0; }
            to { opacity: 1; }
        }

        .modal-content {
            background-color: white;
            margin: 5% auto;
            padding: 30px;
            border-radius: 8px;
            width: 90%;
            max-width: 500px;
            max-height: 80vh;
            overflow-y: auto;
            box-shadow: 0 8px 30px rgba(0,0,0,0.3);
        }

        .modal-header {
            font-size: 20px;
            font-weight: bold;
            margin-bottom: 20px;
            color: #27ae60;
            display: flex;
            justify-content: space-between;
            align-items: center;
        }

        .close-btn {
            background: none;
            border: none;
            font-size: 24px;
            cursor: pointer;
            color: #7f8c8d;
        }

        .close-btn:hover {
            color: #2c3e50;
        }

        .club-list {
            display: flex;
            flex-direction: column;
            gap: 8px;
        }

        .club-item {
            display: flex;
            align-items: center;
            padding: 10px;
            border: 1px solid #ecf0f1;
            border-radius: 4px;
            background: #f8f9fa;
        }

        .club-item input[type="checkbox"] {
            margin-right: 10px;
            cursor: pointer;
            width: 18px;
            height: 18px;
        }

        .club-item label {
            flex: 1;
            cursor: pointer;
            font-size: 14px;
        }

        .club-yardage {
            font-size: 12px;
            color: #7f8c8d;
            margin-left: 10px;
        }

        .yardage-table {
            width: 100%;
            border-collapse: collapse;
            margin-top: 20px;
        }

        .yardage-table th {
            background: #27ae60;
            color: white;
            padding: 10px;
            text-align: left;
            font-size: 12px;
        }

        .yardage-table td {
            padding: 8px;
            border: 1px solid #ecf0f1;
            font-size: 13px;
        }

        .yardage-table tr:nth-child(even) {
            background: #f8f9fa;
        }

        .yardage-input {
            width: 60px;
            padding: 4px;
            border: 1px solid #bdc3c7;
            border-radius: 3px;
            font-size: 12px;
        }

        .modal-buttons {
            display: flex;
            gap: 10px;
            margin-top: 20px;
            justify-content: flex-end;
        }

        .btn {
            padding: 10px 20px;
            border: none;
            border-radius: 4px;
            cursor: pointer;
            font-size: 14px;
            transition: all 0.2s;
        }

        .btn-primary {
            background: #27ae60;
            color: white;
        }

        .btn-primary:hover {
            background: #229954;
        }

        .btn-secondary {
            background: #95a5a6;
            color: white;
        }

        .btn-secondary:hover {
            background: #7f8c8d;
        }

        .swipe-hint {
            position: fixed;
            bottom: 20px;
            left: 50%;
            transform: translateX(-50%);
            background: rgba(0,0,0,0.6);
            color: white;
            padding: 8px 16px;
            border-radius: 20px;
            font-size: 12px;
            pointer-events: none;
            animation: pulse 2s infinite;
        }

        @keyframes pulse {
            0%, 100% { opacity: 0.6; }
            50% { opacity: 1; }
        }

        @media (max-width: 600px) {
            .page-content {
                padding: 30px 20px;
                font-size: 14px;
            }

            .page-content h3 {
                font-size: 20px;
            }

            .cover-page h1 {
                font-size: 36px;
            }

            .header {
                padding: 10px 12px;
            }

            .header-title {
                font-size: 14px;
            }

            .modal-content {
                width: 95%;
                margin: 20% auto;
                padding: 20px;
            }
        }

        .notation {
            background: #ecf0f1;
            padding: 8px 12px;
            border-left: 3px solid #27ae60;
            margin: 12px 0;
            font-size: 13px;
            border-radius: 3px;
        }

        .footer {
            background: #27ae60;
            border-top: 1px solid #229954;
            padding: 12px 16px;
            display: flex;
            justify-content: space-between;
            align-items: center;
            box-shadow: 0 -2px 8px rgba(0,0,0,0.2);
        }

        .page-counter {
            color: white;
            font-size: 12px;
            font-weight: bold;
        }

        .nav-buttons {
            display: flex;
            gap: 8px;
        }

        .nav-btn {
            background: rgba(255,255,255,0.2);
            border: 1px solid rgba(255,255,255,0.4);
            color: white;
            padding: 8px 16px;
            border-radius: 4px;
            cursor: pointer;
            font-size: 13px;
            font-weight: bold;
            transition: all 0.2s;
        }

        .nav-btn:hover {
            background: rgba(255,255,255,0.3);
            border-color: rgba(255,255,255,0.6);
        }

        .nav-btn:disabled {
            background: rgba(255,255,255,0.1);
            border-color: rgba(255,255,255,0.2);
            cursor: not-allowed;
            opacity: 0.5;
        }
    </style>
</head>
<body>
    <div class="container">
        <div class="header">
            <div class="header-title" id="pageTitle">Golfer's Notebook</div>
            <div class="header-buttons">
                <button class="header-btn" id="clubSetupBtn">⚙️ Setup</button>
                <button class="header-btn" id="yardageBtn">📏 Yardage</button>
            </div>
        </div>

        <div class="category-bar" id="categoryBar">
            <button class="category-btn" data-section="0">Home</button>
            <button class="category-btn" data-section="2">Off Tee</button>
            <button class="category-btn" data-section="10">Fairway</button>
            <button class="category-btn" data-section="25">Around Green</button>
            <button class="category-btn" data-section="44">Appendix</button>
        </div>

        <div class="content-area" id="contentArea">
            <!-- Pages will be inserted here -->
        </div>

        <div class="footer">
            <div class="page-counter" id="pageCounter">1 / 43</div>
            <div class="nav-buttons">
                <button class="nav-btn" id="prevBtn" onclick="goToPage(currentPage - 1)">← Back</button>
                <button class="nav-btn" id="nextBtn" onclick="goToPage(currentPage + 1)">Next →</button>
            </div>
        </div>
    </div>

    <!-- Club Setup Modal -->
    <div class="modal" id="clubSetupModal">
        <div class="modal-content">
            <div class="modal-header">
                <span>Club Setup</span>
                <button class="close-btn" onclick="closeModal('clubSetupModal')">&times;</button>
            </div>
            <div id="clubList" class="club-list"></div>
            <div class="modal-buttons">
                <button class="btn btn-secondary" onclick="closeModal('clubSetupModal')">Close</button>
                <button class="btn btn-primary" onclick="saveClubSetup()">Save</button>
            </div>
        </div>
    </div>

    <!-- Yardage Modal -->
    <div class="modal" id="yardageModal">
        <div class="modal-content">
            <div class="modal-header">
                <span>Yardage Chart</span>
                <button class="close-btn" onclick="closeModal('yardageModal')">&times;</button>
            </div>
            <div id="yardageContent"></div>
            <div class="modal-buttons">
                <button class="btn btn-secondary" onclick="closeModal('yardageModal')">Close</button>
                <button class="btn btn-primary" onclick="saveYardages()">Save Changes</button>
            </div>
        </div>
    </div>

    <script>
        const CLUBS = [
            { name: 'Driver', carry: 230, total: 250 },
            { name: '3-Wood', carry: 210, total: 225 },
            { name: '3-Hybrid', carry: 200, total: 210 },
            { name: '3-Iron', carry: 195, total: 200 },
            { name: '4-Iron', carry: 185, total: 190 },
            { name: '5-Iron', carry: 175, total: 180 },
            { name: '6-Iron', carry: 165, total: 170 },
            { name: '7-Iron', carry: 155, total: 160 },
            { name: '8-Iron', carry: 145, total: 150 },

            { name: 'PW', carry: 116, total: 120 },

            { name: 'SW (56°)', carry: 100, total: 105 },
            { name: 'Putter', carry: 0, total: 0 }
        ];

        const PAGES_DATA = [
            {
                title: 'Cover',

                content: `

            },
            {

                type: 'shot',
                content: `
                    <div class="page-content">
                        <h3>High Fade</h3>
                        <h4>Recommended Clubs</h4>
                        <p>Driver (230y carry), 3-Wood (210y carry)</p>
                        <h4>Strategy</h4>
                        <p>Use fade when needing accuracy on narrow fairways or when right side is open. Reduces distance slightly vs. straight ball.</p>
                        <h4>When to Play</h4>

                            <li>Swaying laterally instead of rotating</li>
                        </ul>
                    </div>
                `
            },
            {
                title: 'High Draw',
                type: 'shot',
                content: `
                    <div class="page-content">
                        <h3>High Draw</h3>
                        <h4>Recommended Clubs</h4>
                        <p>Driver (230y carry), 3-Wood (210y carry)</p>
                        <h4>Strategy</h4>

                            <li>Starting open but then rolling hands excessively (hooks instead of draw)</li>
                            <li>Tension in forearms limiting release</li>
                        </ul>
                    </div>
                `
            },
            {
                title: 'Straight Shot',
                type: 'shot',
                content: `
                    <div class="page-content">
                        <h3>Straight Shot</h3>
                        <h4>Recommended Clubs</h4>
                        <p>Driver (230y carry)</p>
                        <h4>Strategy</h4>
                        <p>Maximum control, neutral shape. Reliable for tight fairways or when shaping risk isn't worth it.</p>
                        <h4>When to Play</h4>
                        <ul>
                            <li>Tight, straight fairways</li>
                            <li>No clear advantage to fading or drawing</li>
                            <li>Low confidence in shaping</li>
                        </ul>
                        <h4>Setup</h4>
                        <ul>
                            <li><strong>Stance:</strong> Square (feet parallel to target line)</li>

                        <ul>
                            <li><strong>Backswing:</strong> Full, smooth rotation; club face square to swing path</li>

                        <h4>Common Mistakes</h4>

                            <li>Gripping too tightly (inhibits release)</li>

                        </ul>
                    </div>
                `
            },
            {
                title: 'High Straight',
                type: 'shot',
                content: `
                    <div class="page-content">
                        <h3>High Straight</h3>
                        <h4>Recommended Clubs</h4>
                        <p>Driver (230y carry)</p>
                        <h4>Strategy</h4>
                        <p>Maximum loft, distance-reducing trajectory. Better control, softer landing.</p>
                        <h4>When to Play</h4>

                            <li>Firm/hard fairways (less rollout needed)</li>

        let currentPage = 0;
        let startY = 0;
        let activeClubs = [];

        function initializeApp() {
            renderPages();
            loadClubSetup();
            updatePageTitle();
            setupCategoryBar();
            populateClubList();
            populateYardageTable();
            addSwipeListener();
        }

        function renderPages() {
            const contentArea = document.getElementById('contentArea');
            contentArea.innerHTML = '';
            PAGES_DATA.forEach((page, index) => {
                const pageDiv = document.createElement('div');
                pageDiv.className = 'page' + (index === currentPage ? ' active' : '');
                pageDiv.innerHTML = page.content;
                contentArea.appendChild(pageDiv);
            });
        }

        function goToPage(pageNum) {
            currentPage = Math.max(0, Math.min(pageNum, PAGES_DATA.length - 1));
            updatePages();
            updatePageTitle();
            updateCategoryBar();
        }

        function updatePages() {
            const pages = document.querySelectorAll('.page');
            pages.forEach((page, index) => {
                page.classList.remove('active', 'prev');
                if (index === currentPage) {
                    page.classList.add('active');
                } else if (index < currentPage) {
                    page.classList.add('prev');
                }
            });
        }

        function updatePageTitle() {
            document.getElementById('pageTitle').textContent = PAGES_DATA[currentPage].title || 'Golfer\'s Notebook';
            updatePageCounter();
            updateNavButtons();
        }

        function updatePageCounter() {
            document.getElementById('pageCounter').textContent = (currentPage + 1) + ' / ' + PAGES_DATA.length;
        }

        function updateNavButtons() {
            const prevBtn = document.getElementById('prevBtn');
            const nextBtn = document.getElementById('nextBtn');
            prevBtn.disabled = currentPage === 0;
            nextBtn.disabled = currentPage === PAGES_DATA.length - 1;
        }

        function setupCategoryBar() {
            document.querySelectorAll('.category-btn').forEach(btn => {
                btn.addEventListener('click', function() {
                    const section = parseInt(this.dataset.section);
                    goToPage(section);
                });
            });
        }

        function updateCategoryBar() {
            const categoryBtns = document.querySelectorAll('.category-btn');
            categoryBtns.forEach(btn => {
                const section = parseInt(btn.dataset.section);
                btn.classList.remove('active');
                if (section <= currentPage && currentPage < (section + 10)) {
                    btn.classList.add('active');
                }
            });
        }

        function addSwipeListener() {
            document.addEventListener('touchstart', function(e) {
                startY = e.touches[0].clientY;
            }, false);

            document.addEventListener('touchend', function(e) {
                const endY = e.changedTouches[0].clientY;
                if (startY - endY > 50) {
                    goToPage(currentPage + 1);
                } else if (endY - startY > 50) {
                    goToPage(currentPage - 1);
                }
            }, false);
        }

        function populateClubList() {
            const clubList = document.getElementById('clubList');
            clubList.innerHTML = '';
            CLUBS.forEach((club, index) => {
                const item = document.createElement('div');
                item.className = 'club-item';
                const isActive = activeClubs.includes(index);
                item.innerHTML = `
                    <input type="checkbox" id="club${index}" ${isActive ? 'checked' : ''}>
                    <label for="club${index}">${club.name}</label>
                    <span class="club-yardage">${club.carry}y carry</span>
                `;
                clubList.appendChild(item);
            });
        }

        function populateYardageTable() {
            const tbody = document.getElementById('yardageTableBody');
            tbody.innerHTML = '';
            CLUBS.forEach((club, index) => {
                const row = document.createElement('tr');
                row.innerHTML = `
                    <td>${club.name}</td>
                    <td>${club.carry}y</td>
                    <td>${club.total}y</td>
                `;
                tbody.appendChild(row);
            });
        }

        function openModal(modalId) {
            document.getElementById(modalId).classList.add('active');
        }

        function closeModal(modalId) {
            document.getElementById(modalId).classList.remove('active');
        }

        function saveClubSetup() {
            activeClubs = [];
            document.querySelectorAll('#clubList input[type="checkbox"]').forEach((checkbox, index) => {
                if (checkbox.checked) {
                    activeClubs.push(index);
                }
            });
            localStorage.setItem('activeClubs', JSON.stringify(activeClubs));
            closeModal('clubSetupModal');
        }

        function loadClubSetup() {
            const saved = localStorage.getItem('activeClubs');
            if (saved) {
                activeClubs = JSON.parse(saved);
            } else {
                activeClubs = Array.from(Array(CLUBS.length).keys());
                localStorage.setItem('activeClubs', JSON.stringify(activeClubs));
            }
        }

        function saveYardages() {
            closeModal('yardageModal');
        }

        document.getElementById('clubSetupBtn').addEventListener('click', function() {
            populateClubList();
            openModal('clubSetupModal');
        });

        document.getElementById('yardageBtn').addEventListener('click', function() {
            openModal('yardageModal');
        });

        window.addEventListener('click', function(event) {
            const clubModal = document.getElementById('clubSetupModal');
            const yardageModal = document.getElementById('yardageModal');
            if (event.target == clubModal) {
                closeModal('clubSetupModal');
            }
            if (event.target == yardageModal) {
                closeModal('yardageModal');
            }
        });

        initializeApp();
    </script>
</body>
